<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOMÊ STUDIO · Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tinta:#2B2622;
    --terracota:#C75D3C;
    --areia:#F4ECDF;
    --salvia:#9BAE96;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Outfit",system-ui,sans-serif;
    background:var(--areia);
    color:var(--tinta);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:56px 22px 40px;
    -webkit-font-smoothing:antialiased;
  }
  .page{width:100%;max-width:440px}

  /* ---- Cabeçalho / assinatura ---- */
  header{text-align:center;margin-bottom:44px}
  .mark{
    font-size:34px;
    line-height:1;
    color:var(--terracota);
    font-weight:700;
    display:inline-block;
    transform:translateY(0);
    animation:drop .7s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
  .wordmark{
    font-size:clamp(46px,17vw,64px);
    font-weight:600;
    letter-spacing:.01em;
    line-height:.9;
    margin-top:6px;
  }
  .studio{
    display:block;
    font-size:13px;
    font-weight:500;
    letter-spacing:.42em;
    text-indent:.42em;
    margin-top:14px;
    color:var(--tinta);
    opacity:.7;
  }
  .tagline{
    font-size:15px;
    font-weight:300;
    line-height:1.45;
    max-width:30ch;
    margin:20px auto 0;
    opacity:.85;
  }

  /* ---- Lista de links ---- */
  nav{display:flex;flex-direction:column;gap:12px}
  .link{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    text-decoration:none;
    color:var(--tinta);
    background:transparent;
    border:1.5px solid var(--tinta);
    border-radius:2px;
    padding:17px 20px;
    transition:background .22s ease,color .22s ease,transform .22s ease;
  }
  .link .name{font-size:17px;font-weight:500}
  .link .plat{font-size:12.5px;font-weight:400;opacity:.6;transition:opacity .22s ease}
  .link .arrow{
    font-size:16px;flex-shrink:0;margin-left:2px;
    transition:transform .22s ease;
  }
  .link:hover,.link:focus-visible{
    background:var(--tinta);
    color:var(--areia);
    outline:none;
  }
  .link:hover .plat,.link:focus-visible .plat{opacity:.75}
  .link:hover .arrow,.link:focus-visible .arrow{transform:translateX(3px)}
  .link:focus-visible{box-shadow:0 0 0 3px var(--terracota)}
  .link .left{display:flex;flex-direction:column;gap:2px;min-width:0}

  /* destaque loja oficial */
  .link.primary{background:var(--terracota);border-color:var(--terracota);color:var(--areia)}
  .link.primary .plat{opacity:.85;color:var(--areia)}
  .link.primary:hover,.link.primary:focus-visible{background:var(--tinta);border-color:var(--tinta)}

  /* ---- rodapé social ---- */
  .social{
    display:flex;justify-content:center;gap:26px;
    margin-top:34px;
  }
  .social a{
    text-decoration:none;color:var(--tinta);
    font-size:13.5px;font-weight:500;letter-spacing:.02em;
    padding:6px 2px;border-bottom:1.5px solid transparent;
    transition:border-color .2s ease,color .2s ease;
  }
  .social a:hover,.social a:focus-visible{border-color:var(--terracota);color:var(--terracota);outline:none}

  .foot{
    text-align:center;margin-top:40px;
    font-size:11.5px;font-weight:300;letter-spacing:.04em;opacity:.55;
  }

  @media (prefers-reduced-motion:reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
  <main class="page">
    <header>
      <span class="mark">^</span>
      <h1 class="wordmark">NOMÊ</h1>
      <span class="studio">STUDIO</span>
      <p class="tagline">Design autoral em iluminação, acessórios e presentes.</p>
    </header>

    <nav>
      <a class="link primary" href="https://nomestudio.com.br" target="_blank" rel="noopener">
        <span class="left">
          <span class="name">Loja oficial</span>
          <span class="plat">catálogo completo</span>
        </span>
        <span class="arrow">→</span>
      </a>

      <a class="link" href="https://shopee.com.br/shop/299964216" target="_blank" rel="noopener">
        <span class="left">
          <span class="name">Shopee</span>
          <span class="plat">loja completa</span>
        </span>
        <span class="arrow">→</span>
      </a>

      <a class="link" href="https://vt.tiktok.com/ZS9Stbv14wUe8-ALnaT/" target="_blank" rel="noopener">
        <span class="left">
          <span class="name">TikTok Shop</span>
          <span class="plat">ver produtos</span>
        </span>
        <span class="arrow">→</span>
      </a>

      <a class="link" href="https://wa.me/5554981250170?text=Ol%C3%A1!%20Gostaria%20de%20um%20or%C3%A7amento%20de%20presentes%20corporativos." target="_blank" rel="noopener">
        <span class="left">
          <span class="name">Presentes corporativos</span>
          <span class="plat">orçamento sob medida</span>
        </span>
        <span class="arrow">→</span>
      </a>
    </nav>

    <div class="social">
      <a href="https://instagram.com/nomestudiobr" target="_blank" rel="noopener">Instagram</a>
      <a href="https://wa.me/5554981250170?text=Ol%C3%A1!%20Vim%20pelo%20link%20da%20NOM%C3%8A%20STUDIO." target="_blank" rel="noopener">WhatsApp</a>
    </div>

    <p class="foot">NOMÊ STUDIO</p>
  </main>
</body>
</html>
